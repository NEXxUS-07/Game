<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Danger Dave: Pac Edition</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <h1>DANGER DAVE <span class="pac">: PAC EDITION</span></h1>
    <div id="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div>LIVES: <span id="lives">3</span></div>
      <div>LEVEL: <span id="level">1</span></div>
      <div>HIGH: <span id="high">0</span></div>
    </div>
    <canvas id="game" width="800" height="480"></canvas>
    <p id="instructions">
      ← → move &nbsp;|&nbsp; ↑ / SPACE jump &nbsp;|&nbsp; collect all dots &amp; diamonds, avoid ghosts,
      grab the big power dot to hunt ghosts, reach the trophy door 🏆
      &nbsp;|&nbsp; Press ENTER to start / restart
    </p>
  </div>
  <script src="game.js"></script>
</body>
</html>
